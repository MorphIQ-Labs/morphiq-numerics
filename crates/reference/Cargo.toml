[package]
name = "morphiq-numerics-reference"
description = "Test oracles for morphiq-numerics: exact integer arithmetic and fixture loaders. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# Run the suite, the determinism digest included, with the library's batched
# functions in SIMD lanes (and runtime detection): the digest must not change.
simd = ["morphiq-numerics/simd", "dep:morphiq-numerics-arch"]
std = ["morphiq-numerics/std", "morphiq-numerics-arch?/std"]

[dependencies]
morphiq-numerics-arch = { path = "../morphiq-numerics-arch", optional = true }
morphiq-numerics = { path = "../morphiq-numerics" }
morphiq-numerics-digest = { path = "../digest" }
num-bigint.workspace = true
num-traits.workspace = true

[dev-dependencies]
serde_json.workspace = true
