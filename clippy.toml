# Platform math-library methods. Their rounding differs between glibc, macOS
# libSystem, musl and Windows, so a result that used one would not be the
# same on every target. The library is no_std and cannot reach them; this
# list keeps tests, tools and examples from reaching them too, so no
# oracle or fixture silently depends on the host. Workspace lints set
# `disallowed_methods = "deny"`.
disallowed-methods = [
    { path = "f64::ln", reason = "platform libm: not identical across targets" },
    { path = "f64::log", reason = "platform libm: not identical across targets" },
    { path = "f64::log2", reason = "platform libm: not identical across targets" },
    { path = "f64::log10", reason = "platform libm: not identical across targets" },
    { path = "f64::ln_1p", reason = "platform libm: not identical across targets" },
    { path = "f64::exp", reason = "platform libm: not identical across targets" },
    { path = "f64::exp2", reason = "platform libm: not identical across targets" },
    { path = "f64::exp_m1", reason = "platform libm: not identical across targets" },
    { path = "f64::powf", reason = "platform libm: not identical across targets" },
    { path = "f64::powi", reason = "platform libm: not identical across targets" },
    { path = "f64::sin", reason = "platform libm: not identical across targets" },
    { path = "f64::cos", reason = "platform libm: not identical across targets" },
    { path = "f64::tan", reason = "platform libm: not identical across targets" },
    { path = "f64::sin_cos", reason = "platform libm: not identical across targets" },
    { path = "f64::asin", reason = "platform libm: not identical across targets" },
    { path = "f64::acos", reason = "platform libm: not identical across targets" },
    { path = "f64::atan", reason = "platform libm: not identical across targets" },
    { path = "f64::atan2", reason = "platform libm: not identical across targets" },
    { path = "f64::sinh", reason = "platform libm: not identical across targets" },
    { path = "f64::cosh", reason = "platform libm: not identical across targets" },
    { path = "f64::tanh", reason = "platform libm: not identical across targets" },
    { path = "f64::asinh", reason = "platform libm: not identical across targets" },
    { path = "f64::acosh", reason = "platform libm: not identical across targets" },
    { path = "f64::atanh", reason = "platform libm: not identical across targets" },
    { path = "f64::cbrt", reason = "platform libm: not identical across targets" },
    { path = "f64::hypot", reason = "platform libm: not identical across targets" },
    { path = "f64::mul_add", reason = "software fma fallback on targets without FMA; use the error-free transforms" },
    { path = "f32::ln", reason = "platform libm: not identical across targets" },
    { path = "f32::exp", reason = "platform libm: not identical across targets" },
    { path = "f32::sin", reason = "platform libm: not identical across targets" },
    { path = "f32::cos", reason = "platform libm: not identical across targets" },
    { path = "f32::powf", reason = "platform libm: not identical across targets" },
]
