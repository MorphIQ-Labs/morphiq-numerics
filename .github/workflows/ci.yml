# morphiq-numerics CI: formatting, lints (including the platform-libm ban),
# documentation, dependency advisories and licenses, the MSRV, the no_std and
# wasm builds, and the test suite on every tier-1 host.
#
# Stages, as `needs`: check -> test. Every job is a required status check in
# the "Main branch protection" ruleset; GitHub reports a job skipped behind a
# failed stage as passing, so the failed job itself must be required. A job is
# added to the ruleset in the same change that adds it here.
#
# The toolchain comes from rust-toolchain.toml. Third-party actions are pinned
# to full commit SHAs; the comment names the release. Tool versions come from
# .cargo/*-version.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  CARGO_TERM_COLOR: always

jobs:
  formal:
    name: negative (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        case: [binding, admitted, axiom, certificate, crosscheck]
    runs-on: ubuntu-24.04
    # About three times a run with neither cache (21 minutes when added); with
    # both, a run takes about 10.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Write the cross-check corpus from the Rust library
        # target/ doesn't exist on a fresh checkout, and the shell opens the
        # redirect before cargo creates it.
        run: |
          mkdir -p target
          cargo run --locked -p morphiq-numerics-reference --bin crosscheck-corpus > target/crosscheck.txt
          MORPHIQ_INTERNAL_CORPUS="$PWD/target/internal-crosscheck.txt" cargo test --locked -p morphiq-numerics --lib internal_crosscheck -- --ignored
      - name: Write the Gappa certificates' Coq proofs
        # The certificates job's image and Gappa version. Gappa's proof search
        # can differ between hosts, so the proofs are written here and checked
        # below rather than committed.
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            bash -c 'apt-get update -qq >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gappa=1.4.1-1 >/dev/null && ./scripts/write_gappa_proofs.sh target/gappa-proofs'
      - name: Sabotage (${{ matrix.case }})
        run: |
          set -x
          case "${{ matrix.case }}" in
            binding)   # a bound proof file changes, the manifest doesn't
              printf '(* edited *)\n' >> formal/exp/ExpReduction.v ;;
            admitted)  # a proof's last Qed becomes Admitted; the manifest is updated so only the admits check can catch it
              f=formal/ln/Ln1pScreen.v
              n=$(grep -n '^Qed\.$' "$f" | tail -1 | cut -d: -f1)
              sed -i "${n}s/^Qed\.\$/Admitted./" "$f"
              sed -n "${n}p" "$f"
              sed -i "s|^[0-9a-f]*  $f\$|$(sha256sum "$f")|" formal/binding.sha256 ;;
            axiom)     # a relied-on theorem gains an axiom; the manifest is updated so only the audit can catch it
              printf 'Axiom sabotage_axiom : 0 = 0.\nDefinition uses_sabotage := sabotage_axiom.\nPrint Assumptions uses_sabotage.\n' >> formal/audit/Audit.v
              sed -i "s|^[0-9a-f]*  formal/audit/Audit.v\$|$(sha256sum formal/audit/Audit.v)|" formal/binding.sha256
              grep -F formal/audit/Audit.v formal/binding.sha256 ;;
            certificate)  # one certificate's Coq proof loses its final step
              f=target/gappa-proofs/exp/reduction.v
              n=$(grep -n '^Qed\.$' "$f" | tail -1 | cut -d: -f1)
              sed -n "$((n-1))p" "$f"
              sed -i "$((n-1))d" "$f" ;;
            crosscheck)   # the Rust result differs from the extracted one in one case
              sed -n 3p target/crosscheck.txt
              sed -i '3s/: 8000000000000000 /: 8000000000000001 /' target/crosscheck.txt
              sed -n 3p target/crosscheck.txt ;;
          esac
          git diff --stat
      - name: Pull the Coq image
        run: docker pull --quiet "$(cat .cargo/coq-image)"
      - name: Cache keys
        id: keys
        run: echo "deps=coq-deps-$(sha256sum .cargo/coq-image .cargo/coq-packages scripts/formal_deps.sh | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: Restore the Coq libraries
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coq-deps
          key: ${{ steps.keys.outputs.deps }}
      - name: Build the Coq libraries
        if: steps.deps.outputs.cache-hit != 'true'
        # The container's user isn't the runner's, so the mounted directory is
        # open to it.
        run: |
          mkdir -p -m 0777 "$RUNNER_TEMP/coq-deps"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP/coq-deps:/deps" -w /w "$(cat .cargo/coq-image)" \
            ./scripts/formal_deps.sh /deps/coq-deps.tar.gz
      - name: Save the Coq libraries
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coq-deps
          key: ${{ steps.keys.outputs.deps }}
      - name: Restore the proof build
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/formal-build
          key: formal-build-${{ steps.keys.outputs.deps }}-${{ hashFiles('formal/**', 'scripts/check_formal.sh', 'target/gappa-proofs/**') }}
          restore-keys: formal-build-${{ steps.keys.outputs.deps }}-
      - name: Proofs build, are bound to the source, assume only the expected axioms, and match the Rust bit for bit
        id: proofs
        run: |
          mkdir -p "$RUNNER_TEMP/formal-build"
          rm -f "$RUNNER_TEMP/formal-build/.built"
          chmod -R a+rwX "$RUNNER_TEMP/formal-build"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP:/t" -w /w "$(cat .cargo/coq-image)" \
            ./scripts/check_formal.sh --deps /t/coq-deps/coq-deps.tar.gz --build /t/formal-build \
            target/crosscheck.txt target/internal-crosscheck.txt target/gappa-proofs
