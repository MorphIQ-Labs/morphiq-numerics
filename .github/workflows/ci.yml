# morphiq-numerics CI: formatting, lints (including the platform-libm ban),
# documentation, dependency advisories and licenses, the MSRV, the no_std and
# wasm builds, and the test suite on every tier-1 host.
#
# Runtime tests follow the checks. Formal validation prepares its own inputs
# and runs alongside the other checks after basic hygiene/formatting gates.
# Every independent gate is a required status check in
# the "Main branch protection" ruleset; formal family jobs are enforced by
# the fail-closed formal (coq) aggregate, including exact receipt coverage.
# GitHub can report downstream skips as passing, so independent gates remain
# individually required. New independent gates enter the ruleset with their CI change.
#
# The toolchain comes from rust-toolchain.toml. Third-party actions are pinned
# to full commit SHAs; the comment names the release. Tool versions come from
# .cargo/*-version.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  CARGO_TERM_COLOR: always

jobs:
  commit-convention:
    name: check / commit-convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Pull request title is a conventional commit
        # The title arrives through the environment, never interpolated into
        # the script, so a crafted title cannot inject shell.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          if printf '%s' "$TITLE" | grep -qE "^($types)(\([a-z0-9._/-]+\))?!?: .+"; then
            printf 'conventional title: %s\n' "$TITLE"
          else
            printf 'Pull request title is not a conventional commit: %s\n' "$TITLE" >&2
            exit 1
          fi

  repository-hygiene:
    outputs:
      prose_only: ${{ steps.prose.outputs.prose_only }}
    name: check / repository-hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check prose scope decisions
        run: python3 -m unittest discover -s ci -p test_prose_ci.py
      - name: Release lockfile synchronization
        run: python3 -m unittest scripts.test_release_fuzz_lock
      - name: Benchmark campaign lifecycle and cost model
        run: python3 -m unittest scripts.bench_campaign.test_campaign scripts.bench_fast.normal_pair.test_screen
      - name: Classify the complete change and check whitespace
        id: prose
        env:
          CI_PROSE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PROSE_HEAD: ${{ github.sha }}
        run: python3 ci/prose_ci.py
      - name: No generated or ignored files are tracked
        run: |
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked_ignored" ]; then
            printf 'Generated or ignored files are tracked:\n%s\n' "$tracked_ignored" >&2
            exit 1
          fi
      - name: The published crates ship the root license texts, unchanged
        # crates.io packages each crate alone, so the license texts are copied
        # into the crate directory; this keeps the copies identical.
        run: |
          for crate in morphiq-numerics morphiq-numerics-arch; do
            for license in LICENSE-MIT LICENSE-APACHE; do
              cmp "$license" "crates/$crate/$license"
            done
          done
      - name: The adapted Thomas recurrence ships its MIT notice
        run: |
          cargo package --locked --allow-dirty --list -p morphiq-numerics | grep -qx THIRD_PARTY_NOTICES.md
        if: ${{ steps.prose.outputs.prose_only != 'true' }}
      - name: The library depends only on the first-party arch crate, optionally
        # Target independence and clean provenance rest on the library being
        # self-contained; its one dependency is the optional first-party lane
        # crate, which itself takes none. Any other needs a decision recorded
        # in AGENTS.md. Its version requirement is the workspace version, which
        # the release pull request bumps in both places.
        run: |
          deps() { awk '/^\[(build-|dev-)?dependencies/{f=1;next} /^\[/{f=0} f && NF && !/^#/' "$1"; }
          version="$(awk -F'"' '/^\[/{f=($0=="[workspace.package]");next} f && /^version = /{print $2}' Cargo.toml)"
          allowed="morphiq-numerics-arch = { path = \"../morphiq-numerics-arch\", version = \"$version\", optional = true }"
          if [ "$(deps crates/morphiq-numerics/Cargo.toml)" != "$allowed" ]; then
            echo 'crates/morphiq-numerics declares a dependency other than the optional arch crate:' >&2
            deps crates/morphiq-numerics/Cargo.toml >&2
            exit 1
          fi
          if deps crates/morphiq-numerics-arch/Cargo.toml | grep -q .; then
            echo 'crates/morphiq-numerics-arch declares a dependency' >&2
            exit 1
          fi
      - name: Only the arch crate may contain unsafe code
        # Every other crate inherits the workspace's unsafe_code = "forbid";
        # the arch crate's own lint table is the one exception (docs/arch.md).
        run: |
          for manifest in crates/*/Cargo.toml; do
            case "$manifest" in crates/morphiq-numerics-arch/*) continue ;; esac
            grep -q '^workspace = true' "$manifest" || { echo "$manifest does not inherit the workspace lints" >&2; exit 1; }
          done
          grep -q '^unsafe_code = "forbid"' Cargo.toml

  secret-scan:
    name: check / secret-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks over the pull request's commits
        # The container is pinned by digest (gitleaks v8.30.1).
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --log-opts="$BASE..HEAD"

  fmt:
    needs: repository-hygiene
    name: check / fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo fmt --all -- --check
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  clippy:
    needs: repository-hygiene
    name: check / clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: workspace
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: rustc --version
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Install ARM lint targets
        run: rustup target add aarch64-unknown-linux-gnu thumbv7em-none-eabihf
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: ./scripts/check_clippy.sh
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # Runs on pull requests and on main, so a newly published advisory blocks
  # the next change and withdraws a just-merged revision from release.
  audit:
    needs: repository-hygiene
    name: check / audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tools
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo install --locked --no-default-features cargo-audit --version "$(cat .cargo/audit-version)"
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: ./scripts/check_advisories.sh
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # The graph may ship under MIT OR Apache-2.0 only while every dependency is
  # permissively licensed; deny.toml is that allowlist.
  licenses:
    needs: repository-hygiene
    name: check / licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tools
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo install --locked cargo-deny --version "$(cat .cargo/deny-version)"
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo deny --locked check licenses
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: ./scripts/check_fuzz_licenses.sh
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # rust-toolchain.toml pins the development toolchain. Select the declared
  # minimum explicitly so this job cannot silently build with the newer pin.
  generators:
    needs: repository-hygiene
    name: check / generators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Every committed fixture matches a fresh run of its generator
        run: ./scripts/check_generators.sh
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # The bivariate fixture needs hours of multiprecision CPU to replay: eight
  # shards together replay every row against the committed file.
  generators-bivariate:
    needs: repository-hygiene
    name: check / generators-bivariate (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Replay this shard of the bivariate-normal reference fixture
        run: ./scripts/check_bivariate_shard.sh ${{ matrix.shard }} 8
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  msrv:
    needs: repository-hygiene
    name: check / msrv
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: rustup toolchain install 1.89.0 --profile minimal
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: rustc --version && cargo --version
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo check --locked --workspace --all-features --all-targets
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # The library builds without std or an allocator, and for wasm: the targets
  # on which a platform libm is least available and most likely to differ.
  no-std:
    needs: repository-hygiene
    name: check / no-std
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo build --locked -p morphiq-numerics --target thumbv7em-none-eabihf
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo build --locked -p morphiq-numerics --target wasm32-unknown-unknown
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}

      # With simd, these targets have only the scalar backend: it must build.
      - run: cargo build --locked -p morphiq-numerics --features simd --target thumbv7em-none-eabihf
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: cargo build --locked -p morphiq-numerics --features simd --target wasm32-unknown-unknown
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  test:
    name: test (${{ matrix.os }})
    needs: [commit-convention, repository-hygiene, secret-scan, fmt, clippy, audit, licenses, generators, generators-bivariate, msrv, no-std]
    # Skipped checks (commit-convention, secret-scan on push) still let this run.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lane backends each host must have (docs/lanes.md §6): the lane
          # tests fail if one is absent, so the job states what it exercised.
          - { os: ubuntu-24.04, backends: "avx2,sse2,scalar" }
          - { os: ubuntu-24.04-arm, backends: "neon,scalar" }
          - { os: macos-15, backends: "neon,scalar" }
          - { os: windows-2025, backends: "avx2,sse2,scalar" }
    runs-on: ${{ matrix.os }}
    env:
      MORPHIQ_REQUIRE_BACKENDS: ${{ matrix.backends }}
      # Receipts belong to this attempt, not the restored Cargo build cache.
      MUTATION_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.os }}
          workspaces: |
            .
            fuzz
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (runner.arch != 'ARM64') }}
        run: cargo test --locked --workspace --all-features
      - name: Install the pinned mutation inventory tool
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15') }}
        run: cargo install --locked cargo-mutants --version "$(cat .cargo/mutants-version)"
      - name: Numerical mutation catalog and whole-crate inventory floor
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15') }}
        run: |
          python3 -m unittest scripts.test_numerical_mutations
          python3 scripts/check_numerical_mutations.py "$RUNNER_TEMP/numerical-mutations-$MUTATION_ATTEMPT"
      - name: Retain numerical mutation receipts and inventory
        if: ${{ always() && needs.repository-hygiene.outputs.prose_only != 'true' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: numerical-mutations-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/numerical-mutations-${{ env.MUTATION_ATTEMPT }}/*.json
            ${{ runner.temp }}/numerical-mutations-${{ env.MUTATION_ATTEMPT }}/logs/
      - name: Install pinned MPFR fuzz tools
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15') }}
        run: ./scripts/install_fuzz.sh
      - name: Fuzz runner shell compatibility and failure propagation
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15') }}
        run: python3 -m unittest scripts.test_fuzz_runner
      - name: MPFR elementary oracle, regression replay and short campaigns
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15') }}
        run: ./scripts/check_fuzz.sh 60
      - name: Retain fuzz failures, logs and evolved corpora
        if: ${{ always() && needs.repository-hygiene.outputs.prose_only != 'true' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elementary-fuzz-${{ matrix.os }}
          path: |
            target/fuzz/logs/
            target/fuzz/artifacts/
            target/fuzz/corpus-*/
          retention-days: 14
      - name: Unpivoted admission and pivot-policy mutation controls
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (runner.os == 'Linux') }}
        run: python3 scripts/check_tridiagonal_unpivoted_mutations.py "$RUNNER_TEMP/unpivoted-mutations-$MUTATION_ATTEMPT"
      - name: Retain mutation receipts
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (always() && runner.os == 'Linux') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpivoted-mutations-${{ matrix.os }}
          path: ${{ runner.temp }}/unpivoted-mutations-${{ env.MUTATION_ATTEMPT }}/
      - if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (runner.arch == 'ARM64') }}

        run: ./scripts/check_fma.sh
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # The scalar kernels' FMA build (eft::two_prod_d): tests, digest and
  # cross-check corpora byte-identical to the default build's.
  fma:
    name: fma (x86-64)
    needs: [commit-convention, repository-hygiene, secret-scan, fmt, clippy, audit, licenses, generators, generators-bivariate, msrv, no-std]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fma
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: ./scripts/check_fma.sh
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # The determinism digest on targets beyond the test hosts: musl's libc,
  # WebAssembly and bare metal, where a platform libm differs most or is absent. Each runs the reference
  # suite, digest included (docs/determinism.md); gate logic lives in scripts/.
  digest:
    name: digest (${{ matrix.target }})
    needs: [commit-convention, repository-hygiene, secret-scan, fmt, clippy, audit, licenses, generators, generators-bivariate, msrv, no-std]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, wasm32-wasip1, thumbv7em-none-eabihf]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: digest-${{ matrix.target }}
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Pinned wasmtime
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (matrix.target == 'wasm32-wasip1') }}
        run: |
          ./scripts/install_wasmtime.sh "$RUNNER_TEMP/wasmtime"
          echo "$RUNNER_TEMP/wasmtime/bin" >> "$GITHUB_PATH"
      - name: QEMU for bare-metal Cortex-M4F
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (matrix.target == 'thumbv7em-none-eabihf') }}
        run: sudo apt-get install --yes --no-install-recommends qemu-system-arm
      - run: ./scripts/check_digest_target.sh ${{ matrix.target }}
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # The AVX-512F lane backend, which the hosted runners may lack, under
  # Intel's Software Development Emulator, pinned by version and SHA-256
  # (.cargo/sde-version, .cargo/sde-sha256); gate logic in scripts/.
  simd-avx512:
    name: simd (avx512, sde)
    needs: [commit-convention, repository-hygiene, secret-scan, fmt, clippy, audit, licenses, generators, generators-bivariate, msrv, no-std]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: simd-avx512
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Pinned Intel SDE
        run: |
          ./scripts/install_sde.sh "$RUNNER_TEMP/sde"
          echo "$RUNNER_TEMP/sde" >> "$GITHUB_PATH"
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - run: ./scripts/check_lanes_sde.sh
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: No lane kernel calls an AVX2 or AVX-512F operation out of line
        run: ./scripts/check_lane_codegen.sh
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # Machine-checked proofs, bound to the source they describe: the double-word
  # error bounds and two_prod's exactness (docs/double-word.md), the Gappa
  # certificates here and their Coq proofs in the formal job below.
  certificates:
    name: certificates (sollya, gappa)
    needs: [commit-convention, repository-hygiene, secret-scan, fmt, clippy, audit, licenses, generators, generators-bivariate, msrv, no-std]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Sollya and Gappa certificates reproduce, prove their goals, and are bound to their sources
        # Debian bookworm, pinned by digest, with Sollya 8.0 and Gappa 1.4.1
        # pinned by package version.
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w \
            debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            bash -c 'apt-get update -qq >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sollya=8.0+ds-2+b1 gappa=1.4.1-1 >/dev/null && ./scripts/check_certificates.sh'
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Prose-only change
        if: ${{ needs.repository-hygiene.outputs.prose_only == 'true' }}
        run: echo "Reviewed prose-only paths; this job's build and runtime checks are not applicable."

  # Formal families own an exact partition of audit entries and extractions.
  # coqdep supplies build closures and selection; unclassified paths select all.
  # The required formal (coq) aggregate checks job results AND every receipt,
  # so a failed/skipped/missing selected family cannot produce a green gate.
  formal-plan:
    name: formal / plan
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
      matrix: ${{ steps.plan.outputs.matrix }}
      deps: ${{ steps.keys.outputs.deps }}
    # This job builds its own Rust corpora and Gappa proofs; it consumes no
    # artifacts from the other check jobs. Starting it independently shortens
    # proof-failure feedback. All other checks remain required for merging.
    needs: [commit-convention, repository-hygiene, secret-scan, fmt]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    # Preparation emits no success receipt; only completed family gates do.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's checkout is a merge commit; its first parent is the
          # base, so the change is HEAD^1..HEAD.
          fetch-depth: 2
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: The selections' tests
        run: python3 -m unittest scripts.test_formal_affected scripts.test_formal_relevant scripts.test_formal_families scripts.test_formal_results
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' }}
      - name: Whether the change can affect the proofs
        # A pull request that touches no proof, no file a proof is bound to, no
        # library source and none of the lane's own files cannot change what this
        # lane checks (scripts/formal_relevant.py), so it reports that and runs
        # nothing further; the job still runs and passes, so the required check
        # means what it says. A push to main always runs the lane in full.
        id: scope
        run: |
          mkdir -p target
          if [ "${{ needs.repository-hygiene.outputs.prose_only }}" = true ]; then
            echo "affected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = pull_request ]; then
            verdict=$(python3 scripts/formal_relevant.py --git-base HEAD^1 --write-changed target/changed-files.txt)
          else
            verdict="affected: push to the default branch"
          fi
          echo "formal lane: $verdict"
          case "$verdict" in
            'affected: '*) echo "affected=true" >> "$GITHUB_OUTPUT" ;;
            'not affected') echo "affected=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "invalid formal scope decision" >&2; exit 1 ;;
          esac
      - name: Write the cross-check corpus from the Rust library
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (steps.scope.outputs.affected == 'true') }}
        # target/ doesn't exist on a fresh checkout, and the shell opens the
        # redirect before cargo creates it.
        run: |
          mkdir -p target
          cargo run --locked -p morphiq-numerics-reference --bin crosscheck-corpus > target/crosscheck.txt
          MORPHIQ_INTERNAL_CORPUS="$PWD/target/internal-crosscheck.txt" cargo test --locked -p morphiq-numerics --lib internal_crosscheck -- --ignored
      - name: Restore the Gappa certificates' Coq proofs
        # Gappa can take a different route to a proof on every run, so the
        # proofs are cached with the stamps of the certificates they were
        # written from and only a changed certificate is rewritten
        # (scripts/write_gappa_proofs.sh); otherwise every run would hand the
        # proof build new sources and recompile all of them.
        id: gappa
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (steps.scope.outputs.affected == 'true') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/gappa-proofs
          key: gappa-proofs-${{ hashFiles('formal/**/*.g', 'scripts/write_gappa_proofs.sh') }}
          restore-keys: gappa-proofs-
      - name: Write the Gappa certificates' Coq proofs
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (steps.scope.outputs.affected == 'true') }}
        # The certificates job's image and Gappa version. Gappa's proof search
        # can differ between hosts, so the proofs are written here and checked
        # below rather than committed.
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251 \
            bash -c 'apt-get update -qq >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gappa=1.4.1-1 >/dev/null && ./scripts/write_gappa_proofs.sh target/gappa-proofs'
      - name: Save the Gappa certificates' Coq proofs
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (steps.scope.outputs.affected == 'true' && steps.gappa.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/gappa-proofs
          key: ${{ steps.gappa.outputs.cache-primary-key }}
      - name: Pull the Coq image
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (steps.scope.outputs.affected == 'true') }}
        run: docker pull --quiet "$(cat .cargo/coq-image)"
      - name: Cache keys
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (steps.scope.outputs.affected == 'true') }}
        id: keys
        run: echo "deps=coq-deps-$(sha256sum .cargo/coq-image .cargo/coq-packages scripts/formal_deps.sh | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: Restore the Coq libraries
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (steps.scope.outputs.affected == 'true') }}
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coq-deps
          key: ${{ steps.keys.outputs.deps }}
      - name: Build the Coq libraries
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (steps.scope.outputs.affected == 'true' && (steps.deps.outputs.cache-hit != 'true')) }}
        # The container's user isn't the runner's, so the mounted directory is
        # open to it.
        run: |
          mkdir -p "$RUNNER_TEMP/coq-deps"
          chmod 0777 "$RUNNER_TEMP/coq-deps"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP/coq-deps:/deps" -w /w "$(cat .cargo/coq-image)" \
            ./scripts/formal_deps.sh /deps/coq-deps.tar.gz
      - name: Save the Coq libraries
        if: ${{ needs.repository-hygiene.outputs.prose_only != 'true' && (steps.scope.outputs.affected == 'true' && (steps.deps.outputs.cache-hit != 'true')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coq-deps
          key: ${{ steps.keys.outputs.deps }}
      - name: Plan dependency closures and exact check ownership
        id: plan
        if: steps.scope.outputs.affected == 'true'
        run: |
          args=()
          if [ "${{ github.event_name }}" = pull_request ]; then
            args=(--changed target/changed-files.txt)
          fi
          mkdir -p target/formal-plan
          chmod a+rwx target/formal-plan
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/target/formal-plan:/plan" -v "$RUNNER_TEMP:/t" -w /w "$(cat .cargo/coq-image)" \
            ./scripts/check_formal.sh --deps /t/coq-deps/coq-deps.tar.gz --plan-only --plan-out /plan/families.json \
            "${args[@]}" target/crosscheck.txt target/internal-crosscheck.txt target/gappa-proofs
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          plan = json.loads(Path('target/formal-plan/families.json').read_text())
          print('matrix=' + json.dumps({'include': [dict(family=n, key=plan['families'][n]['cache_key']) for n in plan['selected']]}))
          PYCODE
          tar -czf target/formal-inputs.tar.gz -C target crosscheck.txt internal-crosscheck.txt gappa-proofs formal-plan
      - name: Retain the source-bound formal inputs and plan
        if: steps.scope.outputs.affected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-inputs
          path: target/formal-inputs.tar.gz
          if-no-files-found: error

  formal-family:
    name: formal / ${{ matrix.family }}
    needs: formal-plan
    if: needs.formal-plan.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.formal-plan.outputs.matrix) }}
    env:
      FORMAL_FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-inputs
          path: target
      - name: Restore identical corpora and generated proof sources
        run: tar -xzf target/formal-inputs.tar.gz -C target
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coq-deps
          key: ${{ needs.formal-plan.outputs.deps }}
          fail-on-cache-miss: true
      - name: Restore this family's proof closure
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/formal-build
          key: formal-family-${{ matrix.family }}-${{ needs.formal-plan.outputs.deps }}-${{ matrix.key }}
          restore-keys: |
            formal-family-${{ matrix.family }}-${{ needs.formal-plan.outputs.deps }}-
      - name: Build the source-bound family closure
        run: |
          mkdir -p "$RUNNER_TEMP/formal-build"
          rm -f "$RUNNER_TEMP/formal-build/.built"
          chmod -R a+rwX "$RUNNER_TEMP/formal-build"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP:/t" -w /w "$(cat .cargo/coq-image)" \
            ./scripts/check_formal.sh --family "$FORMAL_FAMILY" --build-only \
            --deps /t/coq-deps/coq-deps.tar.gz --build /t/formal-build \
            target/crosscheck.txt target/internal-crosscheck.txt target/gappa-proofs 2>&1 | tee target/formal-build.log
      - name: Was the proof build completed
        id: built
        if: ${{ !cancelled() && steps.build.outputs.cache-hit != 'true' }}
        run: if [ -e "$RUNNER_TEMP/formal-build/.built" ]; then echo "built=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save compiled proofs before running audits
        if: ${{ !cancelled() && steps.built.outputs.built == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/formal-build
          key: ${{ steps.build.outputs.cache-primary-key }}
      - name: Audit assumptions and cross-check owned extractions
        run: |
          mkdir -p target/formal-result
          chmod a+rwx target/formal-result
          docker run --rm -v "$PWD:/w:ro" -v "$PWD/target/formal-result:/result" -v "$RUNNER_TEMP:/t" -w /w "$(cat .cargo/coq-image)" \
            ./scripts/check_formal.sh --family "$FORMAL_FAMILY" \
            --deps /t/coq-deps/coq-deps.tar.gz --build /t/formal-build \
            --plan-out /result/actual-plan.json --receipt "/result/$FORMAL_FAMILY.json" \
            target/crosscheck.txt target/internal-crosscheck.txt target/gappa-proofs 2>&1 | tee target/formal-audit.log
      - name: Retain the completed family's receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-receipt-${{ matrix.family }}
          path: target/formal-result/${{ matrix.family }}.json
          if-no-files-found: error
      - name: Retain stage timings and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-logs-${{ matrix.family }}
          path: |
            target/formal-build.log
            target/formal-audit.log
            target/formal-result/actual-plan.json

  formal:
    name: formal (coq)
    needs: [repository-hygiene, formal-plan, formal-family]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require successful planning and selected execution
        env:
          HYGIENE: ${{ needs.repository-hygiene.result }}
          PLAN: ${{ needs.formal-plan.result }}
          AFFECTED: ${{ needs.formal-plan.outputs.affected }}
          FAMILIES: ${{ needs.formal-family.result }}
        run: |
          python3 scripts/formal_results.py status --hygiene "$HYGIENE" --planner "$PLAN" --affected "$AFFECTED" --families "$FAMILIES"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.formal-plan.outputs.affected == 'true'
        with:
          name: formal-inputs
          path: target
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.formal-plan.outputs.affected == 'true'
        with:
          pattern: formal-receipt-*
          merge-multiple: true
          path: target/formal-receipts
      - name: Verify every selected check completed against the planned inputs
        if: needs.formal-plan.outputs.affected == 'true'
        run: |
          tar -xzf target/formal-inputs.tar.gz -C target formal-plan/families.json
          python3 scripts/formal_results.py aggregate --plan target/formal-plan/families.json --receipts target/formal-receipts
