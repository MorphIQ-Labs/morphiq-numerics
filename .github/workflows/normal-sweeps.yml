name: scheduled normal boundary sweeps

on:
  schedule:
    - cron: '41 3 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: normal-boundary-sweeps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    name: normal sweeps (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz-${{ matrix.os }}
          workspaces: fuzz
      - name: Audit the oracle dependencies
        run: |
          cargo install --locked cargo-audit --version "$(cat .cargo/audit-version)"
          cargo install --locked cargo-deny --version "$(cat .cargo/deny-version)"
          ./scripts/check_advisories.sh
          ./scripts/check_fuzz_licenses.sh
      - name: Validate enumeration and receipt failure behavior
        run: |
          python3 -m unittest scripts.test_normal_sweeps
          cargo test --manifest-path fuzz/Cargo.toml --locked --no-default-features --lib
          cargo test --manifest-path fuzz/Cargo.toml --locked --no-default-features --features simd --lib
      - name: Sweep every input in the declared windows, scalar and SIMD
        run: python3 scripts/check_normal_sweeps.py "target/normal-sweeps/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain exact coverage, logs and failing packets
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: normal-sweeps-${{ matrix.os }}
          path: target/normal-sweeps/
          retention-days: 14
