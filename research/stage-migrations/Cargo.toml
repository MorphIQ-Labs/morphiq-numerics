[package]
name = "morphiq-stage-migrations"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# An isolated experiment, not a workspace member or a published dependency.
[workspace]

[workspace.dependencies]
morphiq-numerics = { path = "../../crates/morphiq-numerics" }
serde_json = "1.0"

[dependencies]
morphiq-numerics.workspace = true
serde_json.workspace = true

[profile.release]
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
